appId: com.amplitude.unified.smoke
---
- launchApp:
    clearState: true
- assertVisible: "sr=true"
- assertVisible: "exp=true"
- extendedWaitUntil:
    visible: "recording=true"
    timeout: 10000
- tapOn: "Track Event"
- tapOn: "Set User"
- assertVisible: "user=smoke-user"
- tapOn: "Fetch Flags"
- extendedWaitUntil:
    visible: "fetch=ok"
    timeout: 15000
- tapOn: "Read Variant"
- assertVisible: "variant=treatment"
- tapOn: "Open Second Screen"
- assertVisible: "Second screen"
- back
- tapOn: "Toggle Opt Out"
- assertVisible: "optOut=true"
- extendedWaitUntil:
    visible: "recording=false"
    timeout: 5000
- tapOn: "Toggle Opt Out"
- assertVisible: "optOut=false"
- extendedWaitUntil:
    visible: "recording=true"
    timeout: 10000
- tapOn: "Reset"
- assertVisible: "user=null"
- tapOn: "Track Event"
- tapOn: "Flush"
- waitForAnimationToEnd:
    timeout: 3000
# Backgrounding flushes Session Replay and ends the foreground session.
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 5000
- launchApp:
    clearState: false
- assertVisible: "sr=true"
- tapOn: "Flush"
- waitForAnimationToEnd:
    timeout: 5000
