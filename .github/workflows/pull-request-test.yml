name: Test and Lint

on:
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: Exact Amplitude-Kotlin commit for a private release run
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build with JDK ${{ matrix.java-version }}
    runs-on: ${{ inputs.source_sha && github.repository == 'amplitude/sdk-publisher' && github.workflow_ref == 'amplitude/sdk-publisher/.github/workflows/amplitude-kotlin.yml@refs/heads/sdk/amplitude-kotlin' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    strategy:
      matrix:
        java-version: [21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: ${{ inputs.source_sha && 'amplitude/Amplitude-Kotlin' || github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: ${{ !inputs.source_sha && 'gradle' || '' }}

      - name: Install SDK packages for Blacksmith
        if: ${{ inputs.source_sha }}
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35"'

      - name: Build
        run: ./gradlew build -x test

      - name: Upload build results
        if: ${{ always() && !inputs.source_sha }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # artifacts name
          name: build-results-${{ matrix.java-version }}
          # copy reports of all packages
          path: '**/build/reports/**'
          # artifact will expire in 7 days.
          retention-days: 7

  test-and-lint:
    name: Test and Lint with JDK 21
    runs-on: ${{ inputs.source_sha && github.repository == 'amplitude/sdk-publisher' && github.workflow_ref == 'amplitude/sdk-publisher/.github/workflows/amplitude-kotlin.yml@refs/heads/sdk/amplitude-kotlin' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: ${{ inputs.source_sha && 'amplitude/Amplitude-Kotlin' || github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: ${{ !inputs.source_sha && 'npm' || '' }}
          package-manager-cache: ${{ !inputs.source_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ !inputs.source_sha && 'gradle' || '' }}

      - name: Install SDK packages for Blacksmith
        if: ${{ inputs.source_sha }}
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35"'

      - name: Unit Test
        run: ./gradlew test

      - name: Test release tooling
        env:
          RELEASE_SOURCE: ${{ inputs.source_sha }}
        run: |
          if [[ -n "$RELEASE_SOURCE" ]]; then
            npm ci --ignore-scripts
          else
            npm ci
          fi
          npm run test:release

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: API Compatibility Check
        run: ./gradlew apiCheck

      - name: Upload test and lint results
        if: ${{ always() && !inputs.source_sha }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-lint-results
          path: '**/build/reports/**'
          retention-days: 7
