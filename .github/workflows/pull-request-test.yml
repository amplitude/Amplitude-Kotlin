name: Test and Lint

on:
  pull_request:
  workflow_call:

jobs:
  build:
    name: Build with JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build
        run: ./gradlew build -x test

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # artifacts name
          name: build-results-${{ matrix.java-version }}
          # copy reports of all packages
          path: '**/build/reports/**'
          # artifact will expire in 7 days.
          retention-days: 7

  test-and-lint:
    name: Test and Lint with JDK 21
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Unit Test
        run: ./gradlew test -x :sdk-verification:test

      - name: Test release tooling
        run: |
          npm ci
          npm run test:release

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: API Compatibility Check
        run: ./gradlew apiCheck

      - name: Upload test and lint results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-lint-results
          path: '**/build/reports/**'
          retention-days: 7

  sdk-verification:
    name: SDK Verification with JDK 21
    runs-on: ubuntu-latest
    needs: build
    env:
      SDK_VERIFICATION_KOTLIN_VERSION: 1.32.1-SDK-VERIFICATION-SNAPSHOT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Publish Kotlin SDK candidate locally
        run: ./gradlew :analytics-core:publishToMavenLocal :android:publishToMavenLocal -PVERSION_NAME=$SDK_VERIFICATION_KOTLIN_VERSION

      - name: Run SDK verification
        run: >-
          ./gradlew sdkVerificationTest
          -PsdkVerificationKotlinVersion=$SDK_VERIFICATION_KOTLIN_VERSION

      - name: Upload SDK verification results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-verification-results
          path: 'sdk-verification/build/reports/**'
          retention-days: 7
