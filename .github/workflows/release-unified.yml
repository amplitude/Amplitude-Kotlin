# Releases com.amplitude:unified-android independently of analytics-core/android.
#
# Versioned from `type(unified): ...` commits only, tagged `unified-v<version>`,
# with its version in unified/gradle.properties (see unified/release.config.js).
#
# Regular release:
#   - true — preview what semantic-release would do (dry-run)
#   - false — full release (bump version + publish)
#
# If for some reason publish fails:
#   - publish-only — just publish current unified version to Maven Central
name: Release Unified

on:
  workflow_dispatch:
    inputs:
      dryRun:
        type: choice
        description: 'Do a dry run to preview instead of a real release [true/false/publish-only]'
        options:
          - 'true'
          - 'false'
          - publish-only
        required: true
        default: 'true'

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    steps:
      - name: ${{ github.actor }} permission check to do a release
        uses: "lannonbr/repo-permission-check-action@2bb8c89ba8bf115c4bfab344d6a6f442b24c9a1f" # 2.0.2
        with:
          permission: "write"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-tests:
    name: Run Tests
    uses: ./.github/workflows/pull-request-test.yml

  release:
    name: Release Unified
    runs-on: ubuntu-latest
    needs: [authorize, run-tests]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_AUTHOR_NAME: amplitude-sdk-bot
      GIT_AUTHOR_EMAIL: amplitude-sdk-bot@users.noreply.github.com
      GIT_COMMITTER_NAME: amplitude-sdk-bot
      GIT_COMMITTER_EMAIL: amplitude-sdk-bot@users.noreply.github.com
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Verify release branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Unified releases run from main only."
          exit 1

      # Unified's POM depends on analytics-android at the root VERSION_NAME, but compiles
      # against this checkout. They only match when core is released and published at HEAD.
      - name: Verify core is released at HEAD
        run: |
          core_version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          if ! git diff --quiet "v$core_version" HEAD -- analytics-core android ':!*/src/test'; then
            echo "::error::analytics-core/android changed since v$core_version. Run the core Release workflow first."
            exit 1
          fi
          pom="https://repo1.maven.org/maven2/com/amplitude/analytics-android/$core_version/analytics-android-$core_version.pom"
          if ! curl --silent --fail --head "$pom" > /dev/null; then
            echo "::error::analytics-android $core_version is not on Maven Central yet. Retry once it syncs."
            exit 1
          fi

      - name: Semantic Release --dry-run
        if: ${{ github.event.inputs.dryRun == 'true' }}
        run: |
          npm ci
          cd unified && npm exec semantic-release -- --dry-run

      - name: Semantic Release
        if: ${{ github.event.inputs.dryRun == 'false' }}
        run: |
          npm ci
          cd unified && npm exec semantic-release

      - name: Publish to Maven Central
        if: ${{ github.event.inputs.dryRun == 'publish-only' }}
        run: ./gradlew :unified:publishAllPublicationsToMavenCentral -Pamplitude.unified.release=true --no-configuration-cache
