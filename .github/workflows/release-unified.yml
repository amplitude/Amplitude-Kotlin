# Releases com.amplitude:unified-android independently of analytics-core/android.
#
# Releases when the unified/ tree differs from the latest unified-v* tag. The
# selected release type controls the version bump; commit scopes do not.
#
# Regular release:
#   - true — preview what semantic-release would do (dry-run)
#   - false — full release (bump version + publish)
#
# If for some reason publish fails:
#   - publish-only — just publish current unified version to Maven Central
name: Release Unified

on:
  workflow_dispatch:
    inputs:
      dryRun:
        type: choice
        description: 'Do a dry run to preview instead of a real release [true/false/publish-only]'
        options:
          - 'true'
          - 'false'
          - publish-only
        required: true
        default: 'true'
      releaseType:
        type: choice
        description: 'Version bump after the initial 1.0.0 release'
        options:
          - patch
          - minor
          - major
        required: true
        default: patch

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    steps:
      - name: ${{ github.actor }} permission check to do a release
        uses: "lannonbr/repo-permission-check-action@2bb8c89ba8bf115c4bfab344d6a6f442b24c9a1f" # 2.0.2
        with:
          permission: "write"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-tests:
    name: Run Tests
    uses: ./.github/workflows/pull-request-test.yml

  release:
    name: Release Unified
    runs-on: ubuntu-latest
    needs: [authorize, run-tests]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_AUTHOR_NAME: amplitude-sdk-bot
      GIT_AUTHOR_EMAIL: amplitude-sdk-bot@users.noreply.github.com
      GIT_COMMITTER_NAME: amplitude-sdk-bot
      GIT_COMMITTER_EMAIL: amplitude-sdk-bot@users.noreply.github.com
      UNIFIED_RELEASE_TYPE: ${{ github.event.inputs.releaseType }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify release branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Unified releases run from main only."
          exit 1

      - name: Verify Analytics dependency is released
        run: |
          analytics_version="$(sed -n 's/^analyticsAndroid = "\(.*\)"$/\1/p' unified/gradle/libs.versions.toml)"
          if [ -z "$analytics_version" ]; then
            echo "::error::Could not read analyticsAndroid from unified/gradle/libs.versions.toml."
            exit 1
          fi
          pom="https://repo1.maven.org/maven2/com/amplitude/analytics-android/$analytics_version/analytics-android-$analytics_version.pom"
          if ! curl --silent --fail --head "$pom" > /dev/null; then
            echo "::error::analytics-android $analytics_version is not on Maven Central yet."
            exit 1
          fi

      - name: Semantic Release --dry-run
        if: ${{ github.event.inputs.dryRun == 'true' }}
        run: |
          npm ci
          cd unified && npm exec semantic-release -- --dry-run

      - name: Semantic Release
        if: ${{ github.event.inputs.dryRun == 'false' }}
        run: |
          npm ci
          cd unified && npm exec semantic-release

      - name: Publish to Maven Central
        if: ${{ github.event.inputs.dryRun == 'publish-only' }}
        run: ./gradlew :unified:publishAllPublicationsToMavenCentral -Pamplitude.unified.release=true --no-configuration-cache
