name: Unified device verification

on:
  pull_request:
  workflow_call:

jobs:
  smoke:
    name: Minified Unified on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAVEN_REPO: ${{ runner.temp }}/verification-maven
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Publish candidates
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)-verification-${GITHUB_SHA}-SNAPSHOT"
          echo "CANDIDATE_VERSION=$version" >> "$GITHUB_ENV"
          ./gradlew :analytics-core:publishToMavenLocal :android:publishToMavenLocal \
            :unified:publishToMavenLocal -PVERSION_NAME="$version" -Dmaven.repo.local="$MAVEN_REPO"
      - name: Install Maestro 2.6.1
        run: |
          curl -fL --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.6.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "MAESTRO=$RUNNER_TEMP/maestro/bin/maestro" >> "$GITHUB_ENV"
      - name: Test traffic assertions
        run: python3 -m unittest discover -s sdk-verification/device-smoke/tests -v
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run minified consumer
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          script: >-
            JAVA_HOME=$JAVA_HOME_17_X64 sdk-verification/device-smoke/run.sh
            -PunifiedVersion=$CANDIDATE_VERSION -PanalyticsVersion=$CANDIDATE_VERSION
            -Dmaven.repo.local=$MAVEN_REPO
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-device-smoke
          path: |
            sdk-verification/device-smoke/build/smoke/
            sdk-verification/device-smoke/app/build/outputs/mapping/release/
