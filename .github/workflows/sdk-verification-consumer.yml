name: Unified consumer verification

on:
  pull_request:
  workflow_call:

jobs:
  consumer:
    name: Compile and shrink Unified consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAVEN_REPO: ${{ github.workspace }}/build/consumer-maven
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Publish checkout candidates
        run: |
          # Match Unified's Analytics pin inside this isolated repository.
          version="$(sed -n 's/^analyticsAndroid = "\(.*\)"/\1/p' unified/gradle/libs.versions.toml)"
          echo "CANDIDATE_VERSION=$version" >> "$GITHUB_ENV"
          ./gradlew :analytics-core:publishToMavenLocal :android:publishToMavenLocal \
            :unified:publishToMavenLocal -PsignAllPublications=false -PVERSION_NAME="$version" -Dmaven.repo.local="$MAVEN_REPO"
      - name: Build minified consumer
        working-directory: sdk-verification/consumer
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: >-
          ./gradlew :app:assembleRelease
          -PunifiedVersion="$CANDIDATE_VERSION" -PcandidateRepository="$MAVEN_REPO"
